<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Штаб</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B1220; --card:rgba(255,255,255,.055); --card-b:rgba(255,255,255,.10);
    --ink:#EEF2FF; --mute:#8D98B8; --faint:#5C6785;
    --accent:#6B8CFF; --ok:#3DDC97; --warn:#FFB454; --bad:#FF6B6B;
    --sheet:#131B2E;
    --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;
       background:
         radial-gradient(1100px 560px at 15% -12%, #1C2C5C 0%, transparent 60%),
         radial-gradient(900px 520px at 110% 25%, #0E3A3B 0%, transparent 55%),
         var(--bg);
       min-height:100vh;-webkit-text-size-adjust:100%}
  .top{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
       background:rgba(11,18,32,.72);border-bottom:1px solid rgba(255,255,255,.06);
       padding:calc(env(safe-area-inset-top) + 12px) 18px 12px}
  .top .row{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto}
  .brand{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sum{font-size:13px;color:var(--mute);margin:2px 0 0;font-weight:500}
  .sum.bad{color:var(--warn)}
  .poll{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mute);font-weight:600}
  .poll i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
  .poll i.on{background:var(--ok)}
  main{max-width:720px;margin:0 auto;padding:16px 14px 120px}

  .card{background:var(--card);border:1px solid var(--card-b);border-radius:22px;padding:18px 16px 14px;
        margin-bottom:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 18px 40px -24px rgba(0,0,0,.7)}
  .head{display:flex;align-items:center;gap:14px}
  .ring{position:relative;width:66px;height:66px;flex:none}
  .ring svg{width:66px;height:66px;transform:rotate(-90deg)}
  .ring .bgc{fill:none;stroke:rgba(255,255,255,.09);stroke-width:5}
  .ring .fgc{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;
             stroke-dasharray:176;stroke-dashoffset:0;transition:stroke-dashoffset .9s linear,stroke .3s}
  .ring .age{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
             font-weight:800;font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
  .ring .age small{font-size:9.5px;font-weight:600;color:var(--mute);margin-top:2px}
  .who{flex:1;min-width:0}
  .name{font-size:19px;font-weight:800;margin:0;letter-spacing:-.015em}
  .tun{margin:3px 0 0;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
  .tun .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--faint)}
  .tun.ok .dot{background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.15)}
  .tun.bad .dot{background:var(--bad);box-shadow:0 0 0 4px rgba(255,107,107,.15)}
  .tun .ip{color:var(--mute);font-weight:500;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .st{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px 11px;min-width:0}
  .st b{display:block;font-size:11.5px;color:var(--mute);font-weight:600;margin-bottom:3px}
  .st span{display:block;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st span.mono{font-family:var(--mono);font-weight:500;font-size:11.5px;white-space:normal;word-break:break-all;line-height:1.3}
  .st.warn span{color:var(--warn)}

  .acts{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
  .acts::-webkit-scrollbar{display:none}
  .chip{flex:none;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);
        background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:999px;
        padding:10px 15px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
  .chip:active{transform:scale(.97)}
  .chip.pri{background:var(--accent);border-color:transparent;color:#fff}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip:disabled{opacity:.5;cursor:default}
  .chip .sp{width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
            animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  details{margin-top:8px}
  summary{cursor:pointer;color:var(--mute);font-size:13px;font-weight:600;list-style:none;padding:6px 0;display:flex;align-items:center;gap:6px}
  summary::-webkit-details-marker{display:none}
  summary:before{content:"";width:6px;height:6px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);
                 transform:rotate(-45deg);transition:transform .2s;margin-left:2px}
  details[open] summary:before{transform:rotate(45deg)}
  pre{margin:6px 0 0;padding:12px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.06);border-radius:14px;
      font-family:var(--mono);font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:#C9D2EA}
  .clock{font-size:11.5px;color:var(--faint);margin-top:8px;font-weight:500}

  .gate{max-width:420px;margin:12vh auto 0;background:var(--card);border:1px solid var(--card-b);border-radius:24px;padding:26px 22px}
  .gate h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .gate p{margin:0 0 16px;color:var(--mute);font-size:14px}
  .gate input{width:100%;font:inherit;font-family:var(--mono);font-size:13.5px;color:var(--ink);
              background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px 14px}
  .gate input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .gate button{margin-top:12px;width:100%;font:inherit;font-weight:800;font-size:15px;color:#fff;background:var(--accent);
               border:0;border-radius:14px;padding:14px;cursor:pointer}

  .toast{position:fixed;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:20;
         background:#3A1F22;border:1px solid #6B3037;color:#FFD3D3;border-radius:16px;padding:12px 14px;font-size:13.5px;
         box-shadow:0 20px 40px -20px rgba(0,0,0,.8);display:none}
  .toast.show{display:block}

  .veil{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
  .veil.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--sheet);border-radius:26px 26px 0 0;
         max-height:82vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
         box-shadow:0 -20px 60px -20px rgba(0,0,0,.8);padding-bottom:env(safe-area-inset-bottom)}
  .sheet.show{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:10px auto 6px}
  .sh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 18px 10px}
  .sh h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
  .sh .cmd{margin:2px 0 0;font-family:var(--mono);font-size:12px;color:var(--mute);word-break:break-all}
  .x{font:inherit;color:var(--mute);background:rgba(255,255,255,.07);border:0;border-radius:999px;width:34px;height:34px;
     cursor:pointer;flex:none;font-size:18px;line-height:1}
  .sb{padding:0 18px 18px;overflow:auto}
  .state{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13.5px;font-weight:600;padding:6px 0 10px}
  .state .sp{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .state.ok{color:var(--ok)} .state.bad{color:var(--bad)}
  .sb pre{margin:0;max-height:52vh;overflow:auto}
  .free{display:flex;gap:8px;margin-bottom:12px}
  .free input{flex:1;min-width:0;font:inherit;font-family:var(--mono);font-size:13px;color:var(--ink);
              background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 12px}
  .free input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .free button{font:inherit;font-weight:800;color:#fff;background:var(--accent);border:0;border-radius:12px;padding:0 16px;cursor:pointer}
  footer{text-align:center;padding:8px 0 0;font-size:12px;color:var(--faint)}
  footer a{color:var(--mute);text-decoration:none;font-weight:600}
  @media (prefers-reduced-motion:reduce){
    .sheet,.veil,.ring .fgc,.chip{transition:none}
    .sp{animation:none}
  }
</style>
</head>
<body>
<div class="top"><div class="row">
  <div><h1 class="brand">Штаб</h1><p class="sum" id="sum">Подключаюсь…</p></div>
  <div class="poll"><i id="pip"></i><span id="pollt">5 с</span></div>
</div></div>

<main>
  <div id="gate" class="gate" hidden>
    <h2>Подключение</h2>
    <p>Вставь OAuth-токен Яндекс.Диска. Он остаётся в этом браузере и никуда не отправляется, кроме Диска.</p>
    <input id="tok" type="password" placeholder="y0_…" autocomplete="off" spellcheck="false">
    <button id="save">Подключиться</button>
  </div>
  <div id="board"></div>
  <footer id="foot" hidden><a href="#" id="forget">Сменить токен</a></footer>
</main>

<div class="toast" id="toast"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grip"></div>
  <div class="sh">
    <div><h3 id="sh-t"></h3><p class="cmd" id="sh-c"></p></div>
    <button class="x" id="sh-x" aria-label="Закрыть">×</button>
  </div>
  <div class="sb" id="sb"></div>
</div>

<script>
const API  = "https://cloud-api.yandex.net/v1/disk/resources";
const HUB  = "app:/hub";
const NODES = [ {id:"r1", name:"Брод"}, {id:"r2", name:"Алепино"} ];
const ACTIONS = [
  {label:"Статус",      cmd:"__status__",    t:60,  pri:true},
  {label:"Диагностика", cmd:"vpnctl doctor", t:180},
  {label:"Автоподбор",  cmd:"vpnctl auto",   t:300},
  {label:"Скорость",    cmd:"vpn-bench2",    t:180},
  {label:"Аптайм",      cmd:"vpn-uptime",    t:60},
  {label:"Команда…",    free:true}
];
const FRESH = 75, STALE = 300, C = 176;

let token = "";
try { token = localStorage.getItem("hubtok") || ""; } catch(e) {}
const seen = {}, outs = {}, waiting = {}, refs = {};
let turbo = 0, sheetNode = null, sheetId = null;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const line = (txt, key) => {
  const l = (txt||"").split("\n").find(x => x.trim().toLowerCase().startsWith(key));
  return l ? l.split(":").slice(1).join(":").trim() : "";
};
const ago = s => s < 60 ? Math.max(0,Math.round(s)) + " с" : s < 3600 ? Math.round(s/60) + " мин" : Math.round(s/3600) + " ч";
const upfmt = s => { if(!s) return "—"; const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return d ? d+" д "+h+" ч" : h ? h+" ч "+m+" мин" : m+" мин"; };

function api(method, path, body){
  const u = API + "?path=" + encodeURIComponent(path) +
    (method === "GET" ? "&fields=_embedded.items.name,_embedded.items.modified,_embedded.items.custom_properties&limit=20" : "");
  const o = {method, headers:{Authorization:"OAuth " + token}};
  if (body){ o.headers["Content-Type"] = "application/json"; o.body = JSON.stringify(body); }
  return fetch(u, o).then(r => {
    if (r.status === 401) throw new Error("Диск не принял токен. Проверь его или получи заново.");
    if (!r.ok) throw new Error("Диск ответил " + r.status);
    return r.status === 204 ? {} : r.json();
  });
}

function build(){
  const b = $("#board"); b.innerHTML = "";
  NODES.forEach(n => {
    const el = document.createElement("section"); el.className = "card";
    el.innerHTML = `
      <div class="head">
        <div class="ring">
          <svg viewBox="0 0 66 66"><circle class="bgc" cx="33" cy="33" r="28"/><circle class="fgc" cx="33" cy="33" r="28"/></svg>
          <div class="age"><span>—</span><small>назад</small></div>
        </div>
        <div class="who">
          <p class="name">${esc(n.name)}</p>
          <p class="tun"><span class="dot"></span><span class="tt">нет данных</span><span class="ip"></span></p>
        </div>
      </div>
      <div class="stats">
        <div class="st"><b>Конфиг</b><span class="mono cfg">—</span></div>
        <div class="st nf"><b>Неудач</b><span class="nfv">—</span></div>
        <div class="st"><b>Аптайм</b><span class="up">—</span></div>
      </div>
      <div class="acts">${ACTIONS.map((a,i) => `<button class="chip${a.pri?" pri":""}" data-i="${i}">${esc(a.label)}</button>`).join("")}</div>
      <details><summary>Полный статус</summary><pre class="raw">статус ещё не пришёл</pre></details>
      <p class="clock"></p>`;
    b.appendChild(el);
    refs[n.id] = {
      el, fg: el.querySelector(".fgc"), age: el.querySelector(".age span"), tun: el.querySelector(".tun"),
      tt: el.querySelector(".tt"), ip: el.querySelector(".ip"), cfg: el.querySelector(".cfg"),
      nf: el.querySelector(".nf"), nfv: el.querySelector(".nfv"), up: el.querySelector(".up"),
      raw: el.querySelector(".raw"), clock: el.querySelector(".clock"), chips: [...el.querySelectorAll(".chip")]
    };
    refs[n.id].chips.forEach(ch => ch.onclick = () => {
      const a = ACTIONS[+ch.dataset.i];
      a.free ? openFree(n) : send(n, a.cmd, a.t);
    });
  });
}

function paint(items){
  const map = {}, mod = {};
  items.forEach(i => { map[i.name] = i.custom_properties || {}; mod[i.name] = i.modified ? Date.parse(i.modified) : null; });
  const now = Date.now();
  NODES.forEach(n => {
    const r = refs[n.id], st = map[n.id+"-status"] || {}, out = map[n.id+"-out"] || {}, bt = map[n.id+"-beat"] || {};
    const txt = st.txt || "";
    const beat = !!bt.t;
    const tR = parseT(beat ? bt.t : st.t);
    const mR = beat ? mod[n.id+"-beat"] : mod[n.id+"-status"];
    const prev = seen[n.id];
    seen[n.id] = { txt, t: tR, mod: mR, beat, statusT: st.t, took: st.took,
                   at: (prev && prev.t === tR && prev.txt === txt) ? prev.at : now };
    const tun = line(txt, "туннель");
    const okT = /^ok/i.test(tun);
    r.tun.className = "tun " + (tun ? (okT ? "ok" : "bad") : "");
    r.tt.textContent = tun ? (okT ? "Туннель работает" : "Туннель: " + tun) : "нет данных";
    const ipm = tun.match(/ip:\s*([\d.]+)/i); r.ip.textContent = okT && ipm ? ipm[1] : "";
    r.cfg.textContent = (line(txt, "активный конфиг") || "—").replace(/\.json$/, "");
    const nf = line(txt, "неудач"); r.nfv.textContent = nf || "—"; r.nf.classList.toggle("warn", nf !== "" && nf !== "0");
    r.up.textContent = upfmt(st.up || bt.up);
    r.raw.textContent = txt || "статус ещё не пришёл";
    r.clock.textContent = st.t
      ? "статус собран в " + st.t.slice(11) + (st.took ? " за " + st.took + " с" : "")
      : "";
    if (out.txt){ outs[n.id] = out; }
    if (waiting[n.id] && String(out.id) === String(waiting[n.id].id)){
      delete waiting[n.id]; setBusy(n.id, false);
      if (sheetNode === n.id && String(sheetId) === String(out.id)) showResult(out);
    }
  });
  tickAges();
}

function parseT(s){
  const m = /^(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)$/.exec(s || "");
  return m ? new Date(+m[1], m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime() : null;
}
function ageOf(s, now){
  if (!s || !s.txt) return null;
  const aT = s.t ? (now - s.t)/1000 : null;          // по часам роутера
  const aM = s.mod ? (now - s.mod)/1000 : null;       // по метке Диска
  const aO = (now - s.at)/1000;                       // с момента, когда данные последний раз менялись здесь
  let a;
  if (aT !== null && aT >= -180) a = aM !== null ? Math.min(aT, aM) : aT;
  else if (aM !== null) a = aM;                       // часы роутера убежали вперёд
  else a = aO;
  if (a > STALE && aO < 90) a = aO;                   // данные только что менялись — часы врут, не паникуем
  const skew = aT !== null && (aT < -180 || (aM !== null && aT - aM > 600));
  return {a: Math.max(0, a), skew};
}

function tickAges(){
  const now = Date.now(); const bad = [];
  NODES.forEach(n => {
    const r = refs[n.id]; if (!r) return;
    const s = seen[n.id];
    const g = ageOf(s, now);
    if (!g){ r.age.textContent = "—"; r.fg.style.stroke = "var(--faint)"; r.fg.style.strokeDashoffset = C; return; }
    const a = g.a;
    r.age.textContent = ago(a);
    const col = a < FRESH ? "var(--ok)" : a < STALE ? "var(--warn)" : "var(--bad)";
    r.fg.style.stroke = col;
    r.fg.style.strokeDashoffset = a < FRESH ? C * (a / FRESH) : a < STALE ? C * 0.92 : C;
    if (g.skew) r.clock.textContent = "часы роутера сбиты, последний отчёт " + (s.t ? new Date(s.t).toLocaleTimeString("ru-RU") : "—");
    if (a >= STALE) bad.push(n.name + " молчит " + ago(a));
    else if (a >= FRESH) bad.push(n.name + " задерживается");
  });
  const s = $("#sum");
  const have = NODES.filter(n => ageOf(seen[n.id], now)).length;
  if (!have){ s.textContent = "Жду первые данные"; s.className = "sum"; }
  else if (bad.length){ s.textContent = bad.join(", "); s.className = "sum bad"; }
  else { s.textContent = have === NODES.length ? "Обе точки на связи" : "Одна точка на связи"; s.className = "sum"; }
}

function setBusy(id, on){ refs[id].chips.forEach(ch => {
  if (ACTIONS[+ch.dataset.i].free) return;
  ch.disabled = on;
  if (on && !ch.querySelector(".sp") && ACTIONS[+ch.dataset.i].cmd === (waiting[id]||{}).cmd) ch.insertAdjacentHTML("afterbegin", '<span class="sp"></span>');
  if (!on) ch.querySelectorAll(".sp").forEach(x => x.remove());
}); }

function openSheet(n, cmd){
  sheetNode = n.id;
  $("#sh-t").textContent = n.name; $("#sh-c").textContent = cmd || "";
  $("#veil").classList.add("show"); $("#sheet").classList.add("show");
}
function closeSheet(){ $("#veil").classList.remove("show"); $("#sheet").classList.remove("show"); sheetNode = null; }
function showWait(){ $("#sb").innerHTML = '<div class="state"><span class="sp"></span>Выполняю на роутере…</div>'; }
function showResult(o){
  $("#sb").innerHTML = `<div class="state ${o.rc ? "bad" : "ok"}">${o.rc ? "Завершилось с ошибкой, код " + esc(o.rc) : "Готово"}
    <span style="color:var(--faint);font-weight:500">${o.took ? "за " + esc(o.took) + " с" : ""} ${esc((o.t||"").slice(11))}</span></div><pre>${esc(o.txt || "(пустой вывод)")}</pre>`;
}
function openFree(n){
  openSheet(n, "");
  $("#sb").innerHTML = `<div class="free"><input id="fi" placeholder="например, vpnctl doctor" autocomplete="off" spellcheck="false"><button id="fb">Выполнить</button></div>
    ${outs[n.id] ? '<div class="state" style="color:var(--faint)">Последний ответ ниже</div><pre>' + esc(outs[n.id].txt) + '</pre>' : ''}`;
  $("#fb").onclick = () => { const v = $("#fi").value.trim(); if (v) send(n, v, 180); };
  $("#fi").onkeydown = e => { if (e.key === "Enter") $("#fb").click(); };
  setTimeout(() => $("#fi").focus(), 300);
}

function send(n, cmd, t){
  const id = Date.now();
  waiting[n.id] = {id, cmd}; sheetId = id;
  setBusy(n.id, true); openSheet(n, cmd); showWait();
  api("PATCH", HUB + "/" + n.id + "-cmd", {custom_properties:{id, cmd, t}})
    .then(() => { turbo = Date.now() + 240000; tick(); })
    .catch(e => { delete waiting[n.id]; setBusy(n.id, false); $("#sb").innerHTML = `<div class="state bad">${esc(e.message)}</div>`; });
  setTimeout(() => { if (waiting[n.id] && waiting[n.id].id === id){ delete waiting[n.id]; setBusy(n.id, false);
    if (sheetNode === n.id && sheetId === id) $("#sb").innerHTML = '<div class="state bad">Ответа нет 5 минут. Роутер не забрал команду или не смог ответить.</div>'; } }, 300000);
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 6000); }
function fail(e){
  toast(e instanceof TypeError
    ? "Браузер заблокировал запрос к Диску. Открой страницу по https-адресу, а не как локальный файл."
    : e.message);
  $("#pip").classList.remove("on");
}

function load(){
  if (!token){ $("#gate").hidden = false; $("#foot").hidden = true; $("#board").innerHTML = ""; $("#sum").textContent = "Нужен токен"; return; }
  api("GET", HUB).then(d => {
    if (!refs.r1){ build(); }
    $("#gate").hidden = true; $("#foot").hidden = false;
    paint((d._embedded && d._embedded.items) || []);
    $("#pip").classList.add("on");
  }).catch(fail);
}
function tick(){
  const fast = Date.now() < turbo || Object.keys(waiting).length > 0;
  $("#pollt").textContent = fast ? "1 с" : "5 с";
  load();
  clearTimeout(tick._t); tick._t = setTimeout(tick, fast ? 1200 : 5000);
}
setInterval(tickAges, 1000);

$("#save").onclick = () => { const v = $("#tok").value.trim(); if (!v) return; token = v;
  try { localStorage.setItem("hubtok", v); } catch(e) {} tick(); };
$("#forget").onclick = e => { e.preventDefault(); token = ""; try { localStorage.removeItem("hubtok"); } catch(e) {}
  for (const k in refs) delete refs[k]; load(); };
$("#sh-x").onclick = closeSheet; $("#veil").onclick = closeSheet;
tick();
</script>
</body>
</html>
